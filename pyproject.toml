[build-system]
# 平铺布局：kbapp/ 直接位于仓库根，没有 src/ 层。
# 77 是 setuptools 完整支持 PEP 639（字符串 license + license-files）的起点。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "littrace"
version = "0.1.0"
description = "本地文献知识库：全文精读、证据检索与研究工作台"
# setuptools 按后缀把 .md 推导为 text/markdown，并据此填 long_description；
# 缺这一项时 twine check --strict 把两条 warning 当失败（issue #87）。
readme = "README.md"
# SPDX 标识；仓库根的 LICENSE 是 AGPL-3.0-only 全文。
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["literature", "knowledge-base", "fastapi", "sqlite", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# 与 requirements.txt 逐条对应；那份是运行时闭包，这里是打包元数据。
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=1.26,<3",
    "PyMuPDF>=1.24,<2",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# 版本策略：requirements-dev.txt 把 ruff 钉到精确版本，CI 只读那一份；
# 这里保留范围，避免同一个版本号出现在两处需要同步维护。
dev = [
    "pytest>=8",
    "build>=1.2",
    "ruff>=0.16,<0.17",
]

[tool.setuptools]
include-package-data = false
# 显式列出而不是用 find：kbapp/workflows/tools 没有 __init__.py（Python 3
# 命名空间包），find_packages 会漏掉它，而 cli 通过
# kbapp.workflows.tools.registry 动态导入其中的工具。
packages = [
    "kbapp",
    "kbapp.core",
    "kbapp.integrations",
    "kbapp.library",
    "kbapp.research",
    "kbapp.search",
    "kbapp.storage",
    "kbapp.web",
    "kbapp.workflows",
    "kbapp.workflows.tools",
]

[tool.setuptools.package-data]
# 原生 JS/CSS/SVG 由 kbapp.core.web_assets 与 kbapp.web.static_api 按路径读取；
# 不随包安装的话，非 editable 安装后首页和静态资源会 404。
"kbapp.web" = [
    "assets/*.css",
    "assets/*.html",
    "assets/*.js",
    "assets/*.json",
    "assets/icons/*.svg",
    "assets/icons/LICENSE",
    "assets/modules/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未执行 pip install -e . 时，也能从仓库根 import kbapp。
pythonpath = ["."]
markers = [
    "network: the test talks to a real network service",
    "model: the test loads a real local model",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# 平铺布局：仓库根就是第一方代码的导入根。I（isort）首版未开启；
# 将来开启时靠这里判断第一方/第三方，不要再维护模块名清单。
src = ["."]

[tool.ruff.lint]
# 首版刻意保守：E9（语法/IO）与 F（未定义名字、未使用导入等）是回归防线，
# E4/E7 是低命中率、真错误的导入/语句形状。I、E501、B/UP/SIM/D/ANN/S
# 暂不开启；一次只加一族、单独一个 PR。改这里之前先跑
# `ruff check . --statistics` 量出每条规则的命中数再决定。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 首版留空。只在出现真实假阳性时加精确到文件的规则并写明理由；
# 不要用 "tests/**" = ["F401"] 这类大范围豁免——测试里未使用的 import
# 往往是夹具泄漏。
