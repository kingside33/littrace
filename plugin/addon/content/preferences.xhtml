<vbox
  id="littrace-prefs-root"
  onload="Zotero.Littrace &amp;&amp; Zotero.Littrace.prefsPane &amp;&amp; Zotero.Littrace.prefsPane.onPaneLoad(document)"
>
  <!-- Fluent resources are shared across plugins (Zotero consolidates every
       plugin's locale directory into one L10nFileSource), so the plugin name is
       the namespace: every id here is littrace-<key>. The linkset sits inside
       the root element exactly like Zotero's own preferences panes. -->
  <linkset>
    <html:link rel="localization" href="littrace-addon.ftl" />
  </linkset>

  <!-- Shown only on a platform the M1 build does not support. The markup is
       always present; prefsPane.onPaneLoad() decides whether it stays hidden. -->
  <vbox id="littrace-prefs-platform" hidden="true">
    <description data-l10n-id="littrace-prefs-platform-unsupported" />
    <description data-l10n-id="littrace-prefs-platform-unsupported-desc" />
  </vbox>

  <groupbox>
    <label><html:h2 data-l10n-id="littrace-prefs-group-connection" /></label>
    <description data-l10n-id="littrace-prefs-group-connection-desc" />

    <hbox align="center">
      <label data-l10n-id="littrace-prefs-service-host" />
      <label data-l10n-id="littrace-prefs-service-host-value" />
    </hbox>
    <description data-l10n-id="littrace-prefs-service-host-desc" />

    <hbox align="center">
      <label
        control="littrace-prefs-port"
        data-l10n-id="littrace-prefs-connection-port"
      />
      <!-- The preference attribute is the full key: Zotero's pane loader binds
           it and persists changes, so this row needs no plugin code. -->
      <html:input
        id="littrace-prefs-port"
        type="text"
        size="6"
        preference="extensions.zotero.littrace.connection.port"
      />
    </hbox>
    <description data-l10n-id="littrace-prefs-connection-port-desc" />

    <hbox align="center">
      <label data-l10n-id="littrace-prefs-connection-health" />
      <label
        id="littrace-prefs-health"
        data-l10n-id="littrace-prefs-health-checking"
      />
      <html:button id="littrace-prefs-refresh" data-l10n-id="littrace-prefs-refresh" />
    </hbox>
    <description data-l10n-id="littrace-prefs-diagnostics-hint" />
  </groupbox>

  <!-- 云端 AI（服务侧设置，不是 Zotero pref）。
       这里的所有控件都不带 preference= 属性：值存在服务端的 settings.json，
       由 src/settings/settingsPane.ts 经 POST /api/settings 读写。密钥只以
       「已保存 / 未保存」出现，永远不回显。 -->
  <groupbox id="littrace-prefs-cloud">
    <label><html:h2 data-l10n-id="littrace-prefs-group-cloud" /></label>
    <description data-l10n-id="littrace-prefs-group-cloud-desc" />

    <!-- 非 Windows 上 DPAPI 不可用，保存密钥必定失败；这张卡由
         settingsPane.loadCloud() 决定显隐，控件同时置灰。 -->
    <vbox id="littrace-prefs-cloud-platform" hidden="true">
      <description data-l10n-id="littrace-prefs-platform-cloud-unsupported" />
      <description data-l10n-id="littrace-prefs-platform-cloud-unsupported-desc" />
    </vbox>

    <hbox align="center">
      <label
        control="littrace-prefs-cloud-base"
        data-l10n-id="littrace-prefs-cloud-base"
      />
      <html:input id="littrace-prefs-cloud-base" type="text" size="42" />
    </hbox>
    <description data-l10n-id="littrace-prefs-cloud-base-desc" />

    <hbox align="center">
      <label
        control="littrace-prefs-cloud-model"
        data-l10n-id="littrace-prefs-cloud-model"
      />
      <html:input id="littrace-prefs-cloud-model" type="text" size="24" />
    </hbox>
    <description data-l10n-id="littrace-prefs-cloud-model-desc" />

    <hbox align="center">
      <label
        control="littrace-prefs-cloud-key"
        data-l10n-id="littrace-prefs-cloud-key"
      />
      <html:input
        id="littrace-prefs-cloud-key"
        type="password"
        size="32"
        autocomplete="new-password"
      />
      <html:button
        id="littrace-prefs-cloud-clear"
        data-l10n-id="littrace-prefs-cloud-clear"
      />
    </hbox>
    <description data-l10n-id="littrace-prefs-cloud-key-desc" />
    <description
      id="littrace-prefs-cloud-clear-hint"
      data-l10n-id="littrace-prefs-cloud-clear-hint"
      hidden="true"
    />

    <hbox align="center">
      <label
        control="littrace-prefs-cloud-proxy"
        data-l10n-id="littrace-prefs-cloud-proxy"
      />
      <html:input id="littrace-prefs-cloud-proxy" type="text" size="32" />
    </hbox>
    <description data-l10n-id="littrace-prefs-cloud-proxy-desc" />

    <hbox align="center">
      <label
        control="littrace-prefs-cloud-budget-mode"
        data-l10n-id="littrace-prefs-cloud-budget-mode"
      />
      <!-- html:select matches how the rest of this pane uses plain HTML
           controls; the option values are the two strings
           store.save_settings accepts (settingsCore.BUDGET_MODES). -->
      <html:select id="littrace-prefs-cloud-budget-mode">
        <html:option value="limited" data-l10n-id="littrace-prefs-cloud-budget-limited" />
        <html:option value="unlimited" data-l10n-id="littrace-prefs-cloud-budget-unlimited" />
      </html:select>
    </hbox>
    <description data-l10n-id="littrace-prefs-cloud-budget-mode-desc" />

    <hbox align="center">
      <label
        control="littrace-prefs-cloud-daily-budget"
        data-l10n-id="littrace-prefs-cloud-daily-budget"
      />
      <html:input
        id="littrace-prefs-cloud-daily-budget"
        type="number"
        min="0"
        step="any"
        size="8"
      />
    </hbox>
    <description data-l10n-id="littrace-prefs-cloud-daily-budget-desc" />

    <hbox align="center">
      <label
        control="littrace-prefs-cloud-input-price"
        data-l10n-id="littrace-prefs-cloud-input-price"
      />
      <html:input
        id="littrace-prefs-cloud-input-price"
        type="number"
        min="0"
        step="any"
        size="8"
      />
      <label
        control="littrace-prefs-cloud-output-price"
        data-l10n-id="littrace-prefs-cloud-output-price"
      />
      <html:input
        id="littrace-prefs-cloud-output-price"
        type="number"
        min="0"
        step="any"
        size="8"
      />
    </hbox>
    <description data-l10n-id="littrace-prefs-cloud-input-price-desc" />
    <description data-l10n-id="littrace-prefs-cloud-output-price-desc" />

    <checkbox
      id="littrace-prefs-cloud-enabled"
      data-l10n-id="littrace-prefs-cloud-enabled"
    />
    <description data-l10n-id="littrace-prefs-cloud-enabled-desc" />

    <hbox align="center">
      <html:button
        id="littrace-prefs-cloud-save"
        data-l10n-id="littrace-prefs-cloud-save"
      />
      <html:button
        id="littrace-prefs-cloud-test"
        data-l10n-id="littrace-prefs-cloud-test"
      />
      <label id="littrace-prefs-cloud-status" data-l10n-id="littrace-prefs-cloud-loading" />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="littrace-prefs-group-integration" /></label>
    <description data-l10n-id="littrace-prefs-group-integration-desc" />

    <checkbox
      id="littrace-prefs-column-lineage"
      preference="extensions.zotero.littrace.integration.column.lineage"
      data-l10n-id="littrace-prefs-integration-lineage-column"
    />
    <description data-l10n-id="littrace-prefs-integration-lineage-column-desc" />

    <checkbox
      id="littrace-prefs-column-reading"
      preference="extensions.zotero.littrace.integration.column.reading"
      data-l10n-id="littrace-prefs-integration-reading-column"
    />
    <description data-l10n-id="littrace-prefs-integration-reading-column-desc" />

    <description data-l10n-id="littrace-prefs-integration-deeplink" />
    <description data-l10n-id="littrace-prefs-integration-deeplink-desc" />
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="littrace-prefs-group-cache" /></label>
    <description data-l10n-id="littrace-prefs-group-cache-desc" />

    <hbox align="center">
      <label
        control="littrace-prefs-cache-dir"
        data-l10n-id="littrace-prefs-cache-dir"
      />
      <!-- Bound declaratively like the port: Zotero persists the text. The
           Apply button is what forwards it to the service and validates the
           path there, because existence and writability belong to the machine
           running the service, not to Zotero. -->
      <html:input
        id="littrace-prefs-cache-dir"
        type="text"
        size="48"
        preference="extensions.zotero.littrace.cache.dir"
      />
      <html:button id="littrace-prefs-cache-save" data-l10n-id="littrace-prefs-cache-save" />
    </hbox>
    <description data-l10n-id="littrace-prefs-cache-dir-desc" />

    <hbox align="center">
      <label data-l10n-id="littrace-prefs-cache-current" />
      <label id="littrace-prefs-cache-current" data-l10n-id="littrace-prefs-cache-checking" />
    </hbox>
    <description id="littrace-prefs-cache-default" />
    <description id="littrace-prefs-cache-result" hidden="true" />
    <description data-l10n-id="littrace-prefs-cache-reuse" />
    <description data-l10n-id="littrace-prefs-cache-reuse-desc" />
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="littrace-prefs-group-pro" /></label>
    <description data-l10n-id="littrace-prefs-group-pro-desc" />

    <hbox align="center">
      <label data-l10n-id="littrace-prefs-pro-status" />
      <label
        id="littrace-prefs-pro-state"
        data-l10n-id="littrace-prefs-pro-not-running"
      />
    </hbox>

    <hbox align="center">
      <label
        control="littrace-prefs-pro-activate"
        data-l10n-id="littrace-prefs-pro-activate"
      />
      <html:input
        id="littrace-prefs-pro-activate"
        type="text"
        size="28"
        disabled="true"
      />
    </hbox>
    <description data-l10n-id="littrace-prefs-pro-activate-hint" />

    <checkbox
      id="littrace-prefs-pro-cross-check"
      preference="extensions.zotero.littrace.pro.cross-check-report"
      data-l10n-id="littrace-prefs-pro-cross-check"
      disabled="true"
    />
    <description data-l10n-id="littrace-prefs-pro-cross-check-desc" />

    <checkbox
      id="littrace-prefs-pro-parallel-driver"
      preference="extensions.zotero.littrace.pro.parallel-driver"
      data-l10n-id="littrace-prefs-pro-parallel-driver"
      disabled="true"
    />
    <description data-l10n-id="littrace-prefs-pro-parallel-driver-desc" />

    <description data-l10n-id="littrace-prefs-pro-needed" />
  </groupbox>

  <description data-l10n-id="littrace-prefs-first-run-note" />
</vbox>
