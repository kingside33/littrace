name: CI

# Two lanes:
#   * The fast lane runs on every push, pull request and merge-queue entry.
#   * The heavy lane (the remaining pytest platforms and the package smoke)
#     runs only on `merge_group` or on a pull request carrying the `full-ci`
#     label. Add the label when a change touches cross-platform behaviour,
#     packaging, or the Python version floor.
#
# The `CI gate` job aggregates both lanes. On an ordinary pull request the
# heavy jobs are skipped and the gate reports `deferred` (a success conclusion);
# on `full-ci` and `merge_group` a skipped heavy job is a failure. The gate
# script is read from the default branch so a pull request cannot supply the
# rule that judges it; the one bootstrap exception is the pull request that
# introduces the script.
#
# There is no path filter on purpose: a missed filter is a silent skip, and this
# repository is small enough that a docs-only pull request can afford the fast
# lane.
#
# The merge queue is not enabled yet: the repository is owned by a personal
# account, and GitHub only offers merge queues to organizations. The
# `merge_group` trigger and the gate's queue semantics are wired now so the
# queue can be enabled later without changing the workflow shape (issue #84).
# Concurrency is grouped by head SHA and never cancels: a required check is
# recorded per SHA, and a cancelled gate cannot turn green afterwards.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` drive `full-ci`. GitHub cannot filter pull_request
    # events by label name, so every label change re-runs the fast lane. That is
    # accepted: the heavy jobs are still skipped unless `full-ci` is present.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

# The workflow only reads the repository and produces throwaway artifacts.
# Jobs that need more declare it locally.
permissions:
  contents: read

jobs:
  python-lint:
    name: python-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The ruff version has one source of truth: requirements-dev.txt pins it
      # exactly. pyproject.toml carries the matching range for pip users and
      # deliberately does not repeat the exact pin. Read the pin; do not copy
      # the number into this workflow.
      - name: Install Ruff
        env:
          PIP_DEFAULT_TIMEOUT: "30"
          PIP_RETRIES: "5"
        run: |
          set -euo pipefail
          SPEC="$(python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("requirements-dev.txt")
          matches = [
              line.strip()
              for line in path.read_text(encoding="utf-8").splitlines()
              if re.match(r"^ruff([<>=!~].*)?$", line.strip())
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one ruff constraint in requirements-dev.txt, got {matches}"
              )
          print(matches[0])
          PY
          )"
          echo "ruff spec: $SPEC"
          python -m pip install "$SPEC"
          ruff --version

      # Only `check` in the first version. Formatting is deliberately left out
      # until the existing tree has been formatted in its own change; turning
      # on `ruff format --check` here would make every pull request red for
      # reasons unrelated to its content.
      #
      # Rules and exemptions live in pyproject.toml. Do not add --select or
      # --ignore here: a second command-line copy would drift from the config
      # developers run locally.
      - name: Ruff check
        run: ruff check --output-format github .

  # The fast pytest leg. The remaining platform/version legs live in
  # `pytest-platforms` below and run only on full-ci or merge_group.
  pytest:
    name: pytest (${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.13"
    uses: ./.github/workflows/_pytest.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}

  frontend-tests:
    name: frontend-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # The source is native JavaScript with no build step and no npm
      # dependencies, so there is intentionally no install or build command.
      #
      # The explicit list below is the test inventory. This check fails when a
      # tracked tests/test_*.cjs file is missing from the list, which is the
      # failure mode a bare `node --test` directory glob would hide.
      #
      # `web-source.cjs` is a helper, not a test, so the glob deliberately
      # stops at `test_*.cjs`.
      - name: Check the explicit test list against git
        shell: bash
        env:
          TRACKED_TESTS: |
            tests/test_dashboard_ui.cjs
            tests/test_feedback.cjs
            tests/test_lineage.cjs
            tests/test_page_performance.cjs
            tests/test_plugin_column.cjs
            tests/test_plugin_hooks.cjs
            tests/test_plugin_manifest.cjs
            tests/test_plugin_menus.cjs
            tests/test_plugin_prefs.cjs
            tests/test_plugin_reader.cjs
            tests/test_plugin_registry.cjs
            tests/test_plugin_sections.cjs
            tests/test_plugin_service_client.cjs
            tests/test_plugin_settings.cjs
            tests/test_plugin_status.cjs
            tests/test_plugin_tabs.cjs
            tests/test_references.cjs
            tests/test_reliability_graph.cjs
            tests/test_role_bubbles.cjs
            tests/test_search.cjs
            tests/test_settings_depth.cjs
            tests/test_task_entry.cjs
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');

          const listed = process.env.TRACKED_TESTS
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .sort();
          const tracked = execFileSync('git', ['ls-files', 'tests/test_*.cjs'], {
            encoding: 'utf8',
          })
            .trim()
            .split(/\r?\n/)
            .filter(Boolean)
            .sort();

          const missing = tracked.filter((file) => !listed.includes(file));
          const extra = listed.filter((file) => !tracked.includes(file));
          if (missing.length > 0 || extra.length > 0) {
            if (missing.length > 0) {
              console.error(`Not in the explicit list: ${missing.join(', ')}`);
            }
            if (extra.length > 0) {
              console.error(`Listed but not tracked by git: ${extra.join(', ')}`);
            }
            process.exit(1);
          }
          console.log(`Explicit list matches all ${tracked.length} tracked node tests.`);
          JS

      - name: Run node tests
        shell: bash
        run: |
          node --test \
            tests/test_dashboard_ui.cjs \
            tests/test_feedback.cjs \
            tests/test_lineage.cjs \
            tests/test_page_performance.cjs \
            tests/test_plugin_column.cjs \
            tests/test_plugin_hooks.cjs \
            tests/test_plugin_manifest.cjs \
            tests/test_plugin_menus.cjs \
            tests/test_plugin_prefs.cjs \
            tests/test_plugin_reader.cjs \
            tests/test_plugin_registry.cjs \
            tests/test_plugin_sections.cjs \
            tests/test_plugin_service_client.cjs \
            tests/test_plugin_settings.cjs \
            tests/test_plugin_status.cjs \
            tests/test_plugin_tabs.cjs \
            tests/test_references.cjs \
            tests/test_reliability_graph.cjs \
            tests/test_role_bubbles.cjs \
            tests/test_search.cjs \
            tests/test_settings_depth.cjs \
            tests/test_task_entry.cjs

  # The plugin builds with zotero-plugin-scaffold (esbuild + zip) and never
  # touches a Zotero binary in CI: `zotero-plugin build` does not read
  # binPath/profilePath, so no Zotero install is needed here.
  #
  # Same two-OS matrix as frontend-tests; the Python matrix's other legs live
  # in pytest-platforms. esbuild ships one platform-specific native binary per
  # runner OS, so building on both legs verifies the committed package-lock.json
  # resolves on both. littrace is developed on Windows (the primary and only
  # verified platform), so windows-latest is the load-bearing leg; ubuntu is the
  # cross-check.
  #
  # No npm cache: the plugin dependency tree is two dev packages, far below the
  # size where cache setup pays for itself.
  plugin-build:
    name: plugin-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install build dependencies
        run: npm ci
      - name: Build the plugin XPI
        run: npm run build
      - name: Check the XPI exists
        shell: bash
        run: |
          set -euo pipefail
          XPI=$(ls .scaffold/build/*.xpi)
          test -s "$XPI"
          echo "XPI built: $XPI"

  # DCO replaces a CLA. The check is a script, not a third-party action, and it
  # reads the script, DCO and CONTRIBUTING.md from the default branch. It never
  # checks out the pull request: the tree under review must not supply the rule
  # that judges it.
  #
  # It runs on pull requests and on merge-queue entries. On merge_group the
  # script reports `not_applicable` and exits 0: the grouped commits already
  # passed the pull-request check.
  #
  # The base..head range is read through the compare API (three-dot, so it uses
  # the merge base) with pagination; a full-history checkout would only add
  # time. A range that resolves to zero commits is a failure, not a silent
  # pass, and an API page that returns fewer commits than GitHub reports also
  # fails closed.
  dco:
    name: dco
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check the DCO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/check_dco.py

  # actionlint catches workflow syntax and expression errors before GitHub does.
  # No .github/actionlint.yaml is needed: littrace uses only GitHub-hosted
  # runner labels, which actionlint already knows. Tavotto's file exists only
  # to declare its self-hosted lab labels.
  #
  # The release binary is pinned by version and downloaded from GitHub rather
  # than pulled from Docker Hub: the runner already has curl/tar, and a Hub
  # rate limit must not turn this cheap check into a red pull request.
  #
  # shellcheck integration starts disabled (`-shellcheck=`) to avoid a first
  # wave of style noise in run: blocks. Enable it once the workflows settle.
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml

  # Heavy lane: the remaining pytest platform/version legs. They are skipped on
  # an ordinary pull request; the gate below turns that into `deferred`.
  pytest-platforms:
    name: pytest-platforms (${{ matrix.python }}, ${{ matrix.os }})
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: windows-latest
            python: "3.13"
    uses: ./.github/workflows/_pytest.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}

  # Heavy lane: the built distribution. Shared with the nightly workflow.
  package-smoke:
    name: package-smoke
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    uses: ./.github/workflows/_package-smoke.yml

  # The stable required context. `always()` makes it run when an upstream job
  # failed or was skipped; the script decides whether that is a pass, a
  # deferred pass, or a failure. The judge comes from the default branch so the
  # pull request cannot rewrite the rule that judges it. The one exception is
  # the bootstrap pull request that introduces the script.
  ci-gate:
    name: CI gate
    if: always()
    needs: [python-lint, pytest, frontend-tests, plugin-build, dco, actionlint, pytest-platforms, package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Choose the judge
        id: judge
        run: |
          set -euo pipefail
          if [ -s trusted/scripts/ci/aggregate_gate.py ]; then
            echo "path=trusted/scripts/ci/aggregate_gate.py" >> "$GITHUB_OUTPUT"
          else
            # bootstrap: the pull request that introduces the gate cannot find
            # it on the default branch yet. This window exists only for that PR.
            echo "path=scripts/ci/aggregate_gate.py" >> "$GITHUB_OUTPUT"
            echo "::notice::default branch does not have aggregate_gate.py yet (bootstrap); using this revision's copy"
          fi
      - name: Aggregate the gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # `unlabeled` still counts as full-ci so removing the label cannot
          # launder a heavy-lane failure into a deferred pass.
          GATE_FULL_CI: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.action == 'unlabeled' && github.event.label.name == 'full-ci')) }}
        run: |
          python -I "${{ steps.judge.outputs.path }}" \
            --gate ci \
            --event "${{ github.event_name }}" \
            --needs-json "$NEEDS_JSON" \
            --full-ci "$GATE_FULL_CI"
