name: CodeQL

# Advanced setup instead of GitHub's default setup: the analysed languages and
# any future query configuration live in this repository and are reviewed like
# code. Today there is no custom CodeQL config file; add one only when a
# concrete, documented false positive cannot be fixed in the source.
#
# The repository is public, so the earlier private-repository caveat no longer
# applies. Whether `CodeQL gate` becomes a required check is a ruleset change,
# tracked separately from this workflow.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    # Weekly, matching the cadence the queries themselves change at.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Same grouping rule as CI: grouped by head SHA and never cancelled, because a
# cancelled gate cannot turn green afterwards. The `CodeQL gate` job below is
# the stable context; the matrix itself is not a contract.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # A hang guard, not a performance budget. Two source-only languages do not
    # need the hour a build-backed matrix would.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # .cjs files are parsed by the JavaScript/TypeScript extractor.
        # Add `actions` once the workflows have settled; there is no Rust here.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Neither Python nor JavaScript needs a build. Skipping autobuild
          # avoids installing the whole application just to extract source.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          # Keep the category stable so the alert ledger survives workflow
          # changes instead of treating every edit as a new analysis.
          category: "/language:${{ matrix.language }}"
          # A merge-queue entry is a temporary combination of main and the
          # queued pull requests; uploading its SARIF would duplicate alerts
          # against a ref that disappears. The queue only needs the analysis
          # conclusion, so do not upload there.
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}

  # The stable required context for CodeQL. The matrix above expands to two
  # check names; this job is the one name a ruleset can require. It is skipped
  # on schedule so a weekly query failure does not turn the main head red.
  codeql-gate:
    name: CodeQL gate
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Choose the judge
        id: judge
        run: |
          set -euo pipefail
          if [ -s trusted/scripts/ci/aggregate_gate.py ]; then
            echo "path=trusted/scripts/ci/aggregate_gate.py" >> "$GITHUB_OUTPUT"
          else
            echo "path=scripts/ci/aggregate_gate.py" >> "$GITHUB_OUTPUT"
            echo "::notice::default branch does not have aggregate_gate.py yet (bootstrap); using this revision's copy"
          fi
      - name: Aggregate the gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python -I "${{ steps.judge.outputs.path }}" \
            --gate codeql \
            --event "${{ github.event_name }}" \
            --needs-json "$NEEDS_JSON"
