name: CodeQL

# Advanced setup instead of GitHub's default setup: the analysed languages and
# any future query configuration live in this repository and are reviewed like
# code. Today there is no custom CodeQL config file; add one only when a
# concrete, documented false positive cannot be fixed in the source.
#
# Private-repository caveat: code scanning with CodeQL requires GitHub Code
# Security for private repositories. Until this repository is public or the
# licence is in place, this workflow may not be able to upload results; do not
# make it a required check yet. Turning it on after the repository becomes
# public is a ruleset change, not a workflow change.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, matching the cadence the queries themselves change at.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Same grouping rule as CI: a new pull request push replaces the previous scan,
# while main and scheduled scans are never cancelled. There is no merge queue,
# so no merge-queue event and no aggregate gate: the matrix is the result.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # A hang guard, not a performance budget. Two source-only languages do not
    # need the hour a build-backed matrix would.
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # .cjs files are parsed by the JavaScript/TypeScript extractor.
        # Add `actions` once the workflows have settled; there is no Rust here.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Neither Python nor JavaScript needs a build. Skipping autobuild
          # avoids installing the whole application just to extract source.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          # Keep the category stable so the alert ledger survives workflow
          # changes instead of treating every edit as a new analysis.
          category: "/language:${{ matrix.language }}"
